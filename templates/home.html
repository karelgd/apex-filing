{% extends "base.html" %}
{% block title %}Login - Apex Filing{% endblock %}
{% block body_class %}home-page{% endblock %}
{% block content %}
<section class="role-login-shell">
  <div class="role-login-grid">
    <div class="role-visual-panel" aria-hidden="true">
      <div class="role-glow glow-one"></div>
      <div class="role-glow glow-two"></div>
      <div class="role-illustration">
        <div class="role-browser-card">
          <div class="role-browser-top">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="role-browser-body">
            <div class="role-doc-preview">
              <div class="doc-line long"></div>
              <div class="doc-line"></div>
              <div class="doc-grid">
                <i></i><i></i><i></i>
                <i></i><i></i><i></i>
                <i></i><i></i><i></i>
              </div>
            </div>
            <div class="role-form-preview">
              <span class="form-dot"></span>
              <div class="form-line"></div>
              <div class="form-line short"></div>
              <div class="form-progress"><span></span></div>
            </div>
          </div>
        </div>
        <div class="role-robot">
          <img class="role-robot-image" src="{{ url_for('static', filename='img/apex-robot-cutout.png') }}" alt="">
        </div>
        <div class="role-floating-note note-a">
          <span></span>
          <strong>I-485</strong>
        </div>
        <div class="role-floating-note note-b">
          <span></span>
          <strong>PDF</strong>
        </div>
      </div>
    </div>

    <div class="role-login-panel">
      <span class="role-eyebrow">Secure access</span>
      <h1>Apex Filing</h1>
      <p>The Ultimate Software for Form Preparers</p>

      <div class="role-options" aria-label="Login options">
        <a class="role-option agency" href="{{ url_for('login', role='agency') }}">
          <span>Agency Login</span>
        </a>
        <a class="role-option client" href="{{ url_for('login', role='client') }}">
          <span>Client Login</span>
        </a>
        <a class="role-option apex" href="{{ url_for('login', role='apex') }}">
          <span>Apex Login</span>
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
