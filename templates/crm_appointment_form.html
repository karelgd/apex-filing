{% extends "base.html" %}
{% block content %}
<div class="crm-form-page">
  <div class="crm-form-card">
    <span class="crm-kicker">{{ 'Edit' if appointment else 'Create' }} Appointment</span>
    <h1>{{ case.client.full_name }}</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="case_title" value="{{ case.title }}">
      <label class="form-label">Case Type</label>
      <input class="form-control mb-3" value="{{ case.title }}" readonly>
      <label class="form-label">Appointment type</label>
      <select class="form-select mb-3" name="appointment_type" required>
        {% for type in ['By Phone', 'On-Site'] %}
          <option value="{{ type }}" {% if appointment and appointment.appointment_type == type %}selected{% endif %}>{{ type }}</option>
        {% endfor %}
      </select>
      <label class="form-label">Start</label>
      <input class="form-control mb-3" type="datetime-local" name="start_at" value="{{ appointment.start_at.strftime('%Y-%m-%dT%H:%M') if appointment else '' }}" required>
      <label class="form-label">Duration</label>
      <select class="form-select mb-3" name="duration_minutes">
        {% for minutes in [15, 30, 45, 60, 90, 120] %}
          <option value="{{ minutes }}" {% if duration_minutes == minutes %}selected{% endif %}>{{ minutes }} minutes</option>
        {% endfor %}
      </select>
      <label class="form-label">Status</label>
      <select class="form-select mb-3" name="status">
        {% for status in ['Scheduled', 'Re-scheduled', 'Completed', 'Canceled', 'No Show'] %}
          <option value="{{ status }}" {% if appointment and appointment.status == status %}selected{% endif %}>{{ status }}</option>
        {% endfor %}
      </select>
      <label class="form-label">Notes</label>
      <textarea class="form-control mb-4" name="notes" rows="4">{{ appointment.notes if appointment else '' }}</textarea>
      <div class="d-flex gap-2">
        <button class="btn btn-primary crm-action-btn">Save Appointment</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('crm_client_detail', client_id=case.client_id) }}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
