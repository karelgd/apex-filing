{% extends "base.html" %}
{% block content %}
<div class="crm-page">
  <h1>{{ 'Edit agreement template' if template else 'Create agreement template' }}</h1>
  <form method="post" class="crm-panel">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label" for="name">Agreement name / version</label>
    <input class="form-control mb-3" id="name" name="name" maxlength="180" value="{{ template.name if template else '' }}" required>
    <label class="form-label" for="content">Agreement content</label>
    <textarea class="form-control mb-3" id="content" name="content" rows="20" maxlength="60000" required>{{ template.content if template else '' }}</textarea>
    <button class="btn btn-primary">{{ 'Save changes' if template else 'Create template' }}</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('agreement_templates') }}">Cancel</a>
  </form>
</div>
{% endblock %}
