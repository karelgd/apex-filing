{% extends "base.html" %}
{% block content %}
<div class="crm-form-page">
  <div class="crm-form-card">
    <span class="crm-kicker">{{ 'Edit' if case else 'Create' }} Case</span>
    <h1>{{ client.full_name }}</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="form-label">Case type or service</label>
      <select class="form-select mb-3" name="title" required>
        <option value="">Select a form or service</option>
        {% for code, purpose in crm_case_services %}
          {% set label = code ~ ' - ' ~ purpose %}
          <option value="{{ label }}" {% if case and case.title == label %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
      <label class="form-label">Price</label>
      <input class="form-control mb-3" type="number" step="0.01" min="0" name="price" value="{{ case.price if case else '0.00' }}" required>
      <label class="form-label">Case manager</label>
      <select class="form-select mb-3" name="case_manager_id">
        <option value="">No case manager selected</option>
        {% for manager in case_managers %}
          <option value="{{ manager.id }}" {% if case and case.case_manager_id == manager.id %}selected{% endif %}>{{ manager.full_name }}</option>
        {% endfor %}
      </select>
      <label class="form-label">Form preparer</label>
      <select class="form-select mb-3" name="form_preparer_id">
        <option value="">No form preparer selected</option>
        {% for preparer in form_preparers %}
          <option value="{{ preparer.id }}" {% if case and case.form_preparer_id == preparer.id %}selected{% endif %}>{{ preparer.full_name }}</option>
        {% endfor %}
      </select>
      <label class="form-label">Tag</label>
      <input class="form-control mb-2" name="new_tag_name" placeholder="Add new tag if not listed">
      <select class="form-select mb-3" name="tag_id">
        <option value="">No tag</option>
        {% for tag in case_tags %}
          <option value="{{ tag.id }}" {% if case and case.tag_id == tag.id %}selected{% endif %}>{{ tag.name }}</option>
        {% endfor %}
      </select>
      <label class="form-label">Status</label>
      <select class="form-select mb-3" name="status">
        {% for status in ['Open', 'Documents Received', 'Documents Needed', 'Documents Ready', 'Completed'] %}
          <option value="{{ status }}" {% if case and case.status == status %}selected{% endif %}>{{ status }}</option>
        {% endfor %}
      </select>
      <label class="form-label">{{ 'Add note' if case else 'Initial note' }}</label>
      <textarea class="form-control mb-4" name="notes" rows="5" placeholder="This will be added to the case note history."></textarea>
      <div class="d-flex gap-2">
        <button class="btn btn-primary crm-action-btn">Save Case</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('crm_client_detail', client_id=client.id) }}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
